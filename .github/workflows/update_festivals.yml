name: Korea Festival Data Auto-Updater

on:
  schedule:
    # 매일 한국 시간 07:00, 17:00 자동 실행
    - cron: '0 22,8 * * *'
  # 웹 UI에서 수동 즉시 실행 지원
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Festival Data Updater
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/update_festivals.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(auto): update festival data via Gemini AI and live sources [$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')]"
            git push
            echo "Changes pushed successfully. Vercel auto-deployment triggered!"
          fi
